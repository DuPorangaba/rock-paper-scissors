<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div id="result"></div>
    <button id="restart" hidden>Play again</button>
    <div id="game">
        <div id="human">
            <div class="score">
                <h1>PLAYER</h1>
                <h1 id="human-score"></h1>
            </div>
            <h1 id="human-choice"></h1>
            <div class="choices">
                <button value="rock">🪨</button>
                <button value="paper">📄</button>
                <button value="scissors">✂️</button>
            </div>
        </div>
        <div id="bot">
            <div class="score">
                <h1 >ROBOT</h1>
                <h1 id="bot-score"></h1>
            </div>
            <h1 id="bot-choice"></h1>
            <h1 class="bot-loading"></h1>
        </div>

    </div>
</body>
</html>
